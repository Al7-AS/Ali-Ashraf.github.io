<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#b98300"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161d"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="500" rx="24" fill="none" stroke="#f5b800" stroke-opacity=".35" stroke-width="2"/>

  <!-- Sidebar -->
  <rect x="20" y="20" width="150" height="460" rx="18" fill="#0d0f15" stroke="#ffffff" stroke-opacity=".06"/>
  <text x="40" y="66" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="url(#gold)">FORCE</text>
  <text x="40" y="92" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffffff">GYM</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#b9bcc6">
    <rect x="34" y="120" width="122" height="34" rx="10" fill="#f5b800" fill-opacity=".15"/>
    <text x="50" y="142" fill="#f5b800">Dashboard</text>
    <text x="50" y="186">Members</text>
    <text x="50" y="222">Trainers</text>
    <text x="50" y="258">Classes</text>
    <text x="50" y="294">Payments</text>
    <text x="50" y="330">Reports</text>
  </g>
  <rect x="34" y="410" width="122" height="48" rx="12" fill="url(#gold)"/>
  <text x="95" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Add Member</text>

  <!-- Header -->
  <text x="200" y="58" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Welcome back, Coach</text>
  <text x="200" y="80" font-family="Arial, sans-serif" font-size="12" fill="#b9bcc6">Here is what is happening today</text>
  <circle cx="752" cy="50" r="18" fill="url(#gold)"/>

  <!-- Stat cards -->
  <g font-family="Arial, sans-serif">
    <rect x="200" y="104" width="170" height="90" rx="14" fill="#14171f" stroke="#f5b800" stroke-opacity=".5"/>
    <text x="218" y="134" font-size="12" fill="#b9bcc6">Active Members</text>
    <text x="218" y="170" font-size="28" font-weight="800" fill="#ffffff">1,240</text>

    <rect x="386" y="104" width="170" height="90" rx="14" fill="#14171f" stroke="#f5b800" stroke-opacity=".5"/>
    <text x="404" y="134" font-size="12" fill="#b9bcc6">Today's Check-ins</text>
    <text x="404" y="170" font-size="28" font-weight="800" fill="#ffffff">186</text>

    <rect x="572" y="104" width="200" height="90" rx="14" fill="#14171f" stroke="#f5b800" stroke-opacity=".5"/>
    <text x="590" y="134" font-size="12" fill="#b9bcc6">Monthly Revenue</text>
    <text x="590" y="170" font-size="28" font-weight="800" fill="url(#gold)">$12.4K</text>
  </g>

  <!-- Bar chart -->
  <rect x="200" y="214" width="370" height="266" rx="14" fill="#14171f"/>
  <text x="220" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Weekly Attendance</text>
  <g fill="url(#gold)">
    <rect x="236" y="390" width="26" height="70" rx="6" opacity=".55"/>
    <rect x="276" y="360" width="26" height="100" rx="6" opacity=".7"/>
    <rect x="316" y="330" width="26" height="130" rx="6" opacity=".85"/>
    <rect x="356" y="300" width="26" height="160" rx="6"/>
    <rect x="396" y="340" width="26" height="120" rx="6" opacity=".8"/>
    <rect x="436" y="310" width="26" height="150" rx="6"/>
    <rect x="476" y="280" width="26" height="180" rx="6"/>
  </g>
  <line x1="220" y1="460" x2="555" y2="460" stroke="#ffffff" stroke-opacity=".12"/>

  <!-- Progress ring -->
  <rect x="586" y="214" width="186" height="266" rx="14" fill="#14171f"/>
  <text x="606" y="242" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Goals</text>
  <circle cx="679" cy="330" r="50" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="12"/>
  <circle cx="679" cy="330" r="50" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="235 314" transform="rotate(-90 679 330)"/>
  <text x="679" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff">75%</text>
  <text x="679" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#b9bcc6">Monthly target</text>

  <!-- Members list -->
  <rect x="200" y="392" width="572" height="0" fill="none"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#ffffff">
    <circle cx="224" cy="500" r="0" fill="none"/>
  </g>
</svg>
